<svg width="900" height="220" viewBox="0 0 900 220"
     xmlns="http://www.w3.org/2000/svg">
  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="48%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f0f6fc"/>
      <stop offset="70%"  stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.7" fill="#19304d" opacity="0.55"/>
    </pattern>

    <style>
      .nm  { animation: up .9s cubic-bezier(.16,1,.3,1) .2s both,
                         gl 6s ease-in-out 2.5s infinite; }
      .hnd { animation: up .7s cubic-bezier(.16,1,.3,1) .5s both; }
      .t1  { animation: lft .6s cubic-bezier(.16,1,.3,1) .62s both; }
      .t2  { animation: lft .6s cubic-bezier(.16,1,.3,1) .76s both; }
      .t3  { animation: lft .6s cubic-bezier(.16,1,.3,1) .90s both; }
      .t4  { animation: lft .6s cubic-bezier(.16,1,.3,1) 1.04s both; }
      .s1  { animation: up  .7s cubic-bezier(.16,1,.3,1) 1.10s both; }
      .s2  { animation: up  .7s cubic-bezier(.16,1,.3,1) 1.24s both; }
      .s3  { animation: up  .7s cubic-bezier(.16,1,.3,1) 1.38s both; }
      .dv  { animation: ln  1.1s cubic-bezier(.16,1,.3,1) .75s both; }
      .tb  { animation: fi  .8s ease 0s both; }
      .cur { animation: bk  1.1s steps(1) infinite; }
      .c0  { animation: up  .4s ease 0s both; }
      .cmt { animation: up  .5s ease .05s both; }
      .ft  { animation: up  .6s ease 1.6s both; }

      @keyframes up  {
        from { opacity:0; transform:translateY(12px); }
        to   { opacity:1; transform:translateY(0); }
      }
      @keyframes lft {
        from { opacity:0; transform:translateX(-8px); }
        to   { opacity:1; transform:translateX(0); }
      }
      @keyframes ln  {
        from { stroke-dashoffset:812; }
        to   { stroke-dashoffset:0; }
      }
      @keyframes fi  { from{opacity:0} to{opacity:1} }
      @keyframes bk  { 50%{opacity:0} }
      @keyframes gl  {
        0%,100% { filter:drop-shadow(0 0 0px rgba(147,197,253,0)); }
        50%     { filter:drop-shadow(0 0 16px rgba(147,197,253,.28)); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="10"/>
  <rect width="900" height="220" fill="url(#dots)" rx="10" opacity="0.7"/>

  <!-- Ambient glows -->
  <ellipse cx="200" cy="95"  rx="320" ry="150" fill="#1e40af" opacity="0.06"/>
  <ellipse cx="820" cy="155" rx="200" ry="110" fill="#5b21b6" opacity="0.05"/>

  <!-- Top gradient bar -->
  <rect class="tb" x="0" y="0" width="900" height="3" fill="url(#bar)"/>

  <!-- Corner brackets TL/TR -->
  <path class="c0" d="M18 30 L18 11 L37 11"   fill="none" stroke="#1e3554" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="c0" d="M882 30 L882 11 L863 11" fill="none" stroke="#1e3554" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Corner brackets BL/BR (delayed) -->
  <path style="animation:up .4s ease 1.5s both;opacity:0" d="M18 190 L18 209 L37 209"   fill="none" stroke="#1e3554" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path style="animation:up .4s ease 1.5s both;opacity:0" d="M882 190 L882 209 L863 209" fill="none" stroke="#1e3554" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Top comment -->
  <text class="cmt" x="46" y="26"
        font-family="'Courier New',monospace" font-size="10"
        fill="#1e3a5f" letter-spacing="1.5">
    // yaswanthme007 · full stack dev · ai builder · chennai, in · 2026
  </text>

  <!-- Main name YASWANTH + K.B suffix -->
  <text class="nm" x="44" y="107"
        font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-weight="800">
    <tspan font-size="68" letter-spacing="1" fill="url(#ng)">YASWANTH</tspan><tspan
      font-size="32" dx="12" fill="#60a5fa"
      font-family="'Courier New',monospace"
      font-weight="400" letter-spacing="5">K.B</tspan>
  </text>

  <!-- Blinking cursor -->
  <rect class="cur" x="506" y="82" width="2.5" height="29" rx="1" fill="#60a5fa" opacity="0.9"/>

  <!-- Handle -->
  <text class="hnd" x="44" y="127"
        font-family="'Courier New',monospace" font-size="11.5"
        fill="#3b5a8c" letter-spacing="2">
    @yaswanthme007  ·  yaswanthkb.dev
  </text>

  <!-- Divider line (draws left to right) -->
  <line class="dv" x1="44" y1="143" x2="856" y2="143"
        stroke="#162032" stroke-width="1"
        stroke-dasharray="812"/>

  <!-- Tag 1: Full Stack Dev -->
  <g class="t1">
    <rect x="44"  y="155" width="122" height="27" rx="5"
          fill="#0c1829" stroke="#1e3554" stroke-width="1"/>
    <text x="105" y="173" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="10.5" fill="#60a5fa">Full Stack Dev</text>
  </g>

  <!-- Tag 2: AI Builder -->
  <g class="t2">
    <rect x="176" y="155" width="90" height="27" rx="5"
          fill="#0c1829" stroke="#1e3554" stroke-width="1"/>
    <text x="221" y="173" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="10.5" fill="#a78bfa">AI Builder</text>
  </g>

  <!-- Tag 3: Web3 Explorer -->
  <g class="t3">
    <rect x="276" y="155" width="106" height="27" rx="5"
          fill="#0c1829" stroke="#1e3554" stroke-width="1"/>
    <text x="329" y="173" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="10.5" fill="#34d399">Web3 Explorer</text>
  </g>

  <!-- Tag 4: RAG / LLM -->
  <g class="t4">
    <rect x="392" y="155" width="86" height="27" rx="5"
          fill="#0c1829" stroke="#1e3554" stroke-width="1"/>
    <text x="435" y="173" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="10.5" fill="#fbbf24">RAG · LLM</text>
  </g>

  <!-- Stats section vertical separator -->
  <line style="animation:up .4s ease 1.06s both;opacity:0"
        x1="536" y1="150" x2="536" y2="186" stroke="#162032" stroke-width="1"/>

  <!-- Stat 1: Contributions -->
  <g class="s1">
    <text x="598" y="169" text-anchor="middle"
          font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="21" font-weight="700" fill="#60a5fa">389</text>
    <text x="598" y="183" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="9"
          fill="#3b5a8c" letter-spacing="1.5">COMMITS</text>
  </g>
  <line class="s1" x1="640" y1="150" x2="640" y2="186" stroke="#162032" stroke-width="1"/>

  <!-- Stat 2: Repos -->
  <g class="s2">
    <text x="688" y="169" text-anchor="middle"
          font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="21" font-weight="700" fill="#a78bfa">43</text>
    <text x="688" y="183" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="9"
          fill="#3b5a8c" letter-spacing="1.5">REPOS</text>
  </g>
  <line class="s2" x1="730" y1="150" x2="730" y2="186" stroke="#162032" stroke-width="1"/>

  <!-- Stat 3: Followers -->
  <g class="s3">
    <text x="778" y="169" text-anchor="middle"
          font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="21" font-weight="700" fill="#34d399">11</text>
    <text x="778" y="183" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="9"
          fill="#3b5a8c" letter-spacing="1.5">FOLLOWERS</text>
  </g>
  <line class="s3" x1="822" y1="150" x2="822" y2="186" stroke="#162032" stroke-width="1"/>

  <!-- Website label far right of stats -->
  <text class="s3" x="858" y="169" text-anchor="end"
        font-family="'Courier New',monospace" font-size="10"
        fill="#3b5a8c">yaswanthkb.dev</text>

  <!-- Footer -->
  <text class="ft" x="856" y="211" text-anchor="end"
        font-family="'Courier New',monospace" font-size="9"
        fill="#1e3554" letter-spacing="1.5">BUILDING THE FUTURE · 2026</text>

</svg>
