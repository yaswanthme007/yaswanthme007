<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .l1{animation:fadeUp 0.6s ease 0.1s forwards;opacity:0}
      .l2{animation:fadeUp 0.6s ease 0.2s forwards;opacity:0}
      .l3{animation:fadeUp 0.6s ease 0.3s forwards;opacity:0}
      .l4{animation:fadeUp 0.6s ease 0.4s forwards;opacity:0}
      .l5{animation:fadeUp 0.6s ease 0.5s forwards;opacity:0}
      .l6{animation:fadeUp 0.6s ease 0.6s forwards;opacity:0}
      .sub{animation:fadeUp 0.6s ease 0.9s forwards;opacity:0}
      .tags{animation:fadeUp 0.6s ease 1.1s forwards;opacity:0}
      .b1{animation:fadeUp 0.6s ease 1.3s forwards;opacity:0}
      .b2{animation:fadeUp 0.6s ease 1.45s forwards;opacity:0}
      .b3{animation:fadeUp 0.6s ease 1.6s forwards;opacity:0}
      .cur{animation:blink 1s steps(1) infinite}
      .glow{animation:glow 3s ease-in-out infinite}
      .scan{animation:scan 6s linear infinite}
      @keyframes fadeUp{
        from{opacity:0;transform:translateY(8px)}
        to{opacity:1;transform:translateY(0)}
      }
      @keyframes blink{50%{opacity:0}}
      @keyframes glow{
        0%,100%{filter:drop-shadow(0 0 3px #58a6ff)}
        50%{filter:drop-shadow(0 0 12px #58a6ff) drop-shadow(0 0 20px #1a4a8a)}
      }
      @keyframes scan{
        0%{transform:translateY(0);opacity:0.04}
        50%{opacity:0.07}
        100%{transform:translateY(220px);opacity:0.04}
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="220" fill="#0d1117" rx="10"/>

  <!-- Scanline sweep -->
  <rect class="scan" x="0" y="-4" width="800" height="4" fill="#58a6ff"/>

  <!-- Corner brackets -->
  <path d="M12 28 L12 10 L30 10" fill="none" stroke="#30363d" stroke-width="1.2"
    style="animation:fadeUp 0.4s ease forwards;opacity:0"/>
  <path d="M788 28 L788 10 L770 10" fill="none" stroke="#30363d" stroke-width="1.2"
    style="animation:fadeUp 0.4s ease forwards;opacity:0"/>
  <path d="M12 192 L12 210 L30 210" fill="none" stroke="#30363d" stroke-width="1.2"
    style="animation:fadeUp 0.4s ease 1.8s forwards;opacity:0"/>
  <path d="M788 192 L788 210 L770 210" fill="none" stroke="#30363d" stroke-width="1.2"
    style="animation:fadeUp 0.4s ease 1.8s forwards;opacity:0"/>

  <!-- Top label -->
  <text style="animation:fadeUp 0.5s ease forwards;opacity:0"
    x="30" y="30" font-family="'Courier New',monospace" font-size="11" fill="#3d444d">
    // yaswanthme007 · github profile · 2026
  </text>

  <!-- ASCII YASWANTH - each line staggered -->
  <g class="glow">
    <text class="l1" x="28" y="62"  font-family="'Courier New',monospace" font-size="9.2" fill="#58a6ff" letter-spacing="0.3">██╗   ██╗ █████╗ ███████╗██╗    ██╗ █████╗ ███╗   ██╗████████╗██╗  ██╗</text>
    <text class="l2" x="28" y="75"  font-family="'Courier New',monospace" font-size="9.2" fill="#58a6ff" letter-spacing="0.3">╚██╗ ██╔╝██╔══██╗██╔════╝██║    ██║██╔══██╗████╗  ██║╚══██╔══╝██║  ██║</text>
    <text class="l3" x="28" y="88"  font-family="'Courier New',monospace" font-size="9.2" fill="#4d9de0" letter-spacing="0.3"> ╚████╔╝ ███████║███████╗██║ █╗ ██║███████║██╔██╗ ██║   ██║   ███████║</text>
    <text class="l4" x="28" y="101" font-family="'Courier New',monospace" font-size="9.2" fill="#4d9de0" letter-spacing="0.3">  ╚██╔╝  ██╔══██║╚════██║██║███╗██║██╔══██║██║╚██╗██║   ██║   ██╔══██║</text>
    <text class="l5" x="28" y="114" font-family="'Courier New',monospace" font-size="9.2" fill="#3d8ed0" letter-spacing="0.3">   ██║   ██║  ██║███████║╚███╔███╔╝██║  ██║██║ ╚████║   ██║   ██║  ██║</text>
    <text class="l6" x="28" y="127" font-family="'Courier New',monospace" font-size="9.2" fill="#3d8ed0" letter-spacing="0.3">   ╚═╝   ╚═╝  ╚═╝╚══════╝ ╚══╝╚══╝ ╚═╝  ╚═╝╚═╝  ╚═══╝   ╚═╝   ╚═╝  ╚═╝</text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cur" x="690" y="115" width="2.5" height="12" fill="#58a6ff"/>

  <!-- Subtitle roles -->
  <text class="sub" x="30" y="148" font-family="'Courier New',monospace" font-size="12" fill="#e6edf3">
    <tspan fill="#a371f7">&gt;</tspan>
    <tspan> Full Stack Dev </tspan>
    <tspan fill="#3d444d"> · </tspan>
    <tspan fill="#a371f7">&gt;</tspan>
    <tspan> AI Builder </tspan>
    <tspan fill="#3d444d"> · </tspan>
    <tspan fill="#a371f7">&gt;</tspan>
    <tspan> Web3 Explorer </tspan>
    <tspan fill="#3d444d"> · </tspan>
    <tspan fill="#a371f7">&gt;</tspan>
    <tspan> Chennai, India</tspan>
  </text>

  <!-- Stat boxes -->
  <g class="b1">
    <rect x="30" y="162" width="158" height="40" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="109" y="178" font-family="'Courier New',monospace" font-size="15"
      font-weight="700" fill="#58a6ff" text-anchor="middle">389</text>
    <text x="109" y="193" font-family="'Courier New',monospace" font-size="10.5"
      fill="#e6edf3" text-anchor="middle">contributions</text>
  </g>
  <g class="b2">
    <rect x="200" y="162" width="158" height="40" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="279" y="178" font-family="'Courier New',monospace" font-size="15"
      font-weight="700" fill="#a371f7" text-anchor="middle">43</text>
    <text x="279" y="193" font-family="'Courier New',monospace" font-size="10.5"
      fill="#e6edf3" text-anchor="middle">repositories</text>
  </g>
  <g class="b3">
    <rect x="370" y="162" width="158" height="40" rx="5" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="449" y="178" font-family="'Courier New',monospace" font-size="15"
      font-weight="700" fill="#3fb950" text-anchor="middle">11</text>
    <text x="449" y="193" font-family="'Courier New',monospace" font-size="10.5"
      fill="#e6edf3" text-anchor="middle">followers</text>
  </g>

  <!-- Right side label -->
  <text style="animation:fadeUp 0.5s ease 1.7s forwards;opacity:0"
    x="770" y="193" font-family="'Courier New',monospace" font-size="10"
    fill="#3d444d" text-anchor="end">Chennai, IN · yaswanthkb.dev</text>

</svg>
