<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Glowing border animation -->
    <style>
      .comment { animation: fadeIn 0.8s ease forwards; opacity: 0; }
      .name-text { animation: glowPulse 3s ease-in-out infinite, fadeSlideUp 1s ease 0.3s forwards; opacity: 0; }
      .roles { animation: fadeSlideUp 1s ease 0.8s forwards; opacity: 0; }
      .box1 { animation: fadeSlideUp 1s ease 1.1s forwards; opacity: 0; }
      .box2 { animation: fadeSlideUp 1s ease 1.3s forwards; opacity: 0; }
      .box3 { animation: fadeSlideUp 1s ease 1.5s forwards; opacity: 0; }
      .num1 { animation: countUp 1.5s ease 1.2s forwards; opacity: 0; }
      .num2 { animation: countUp 1.5s ease 1.4s forwards; opacity: 0; }
      .num3 { animation: countUp 1.5s ease 1.6s forwards; opacity: 0; }
      .border-glow { animation: borderGlow 4s ease-in-out infinite; }
      .scanline { animation: scan 8s linear infinite; }
      .cursor { animation: blink 1s steps(1) infinite; }

      @keyframes fadeIn {
        to { opacity: 1; }
      }
      @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 4px #58a6ff) drop-shadow(0 0 8px #1a6bb5); }
        50% { filter: drop-shadow(0 0 10px #58a6ff) drop-shadow(0 0 20px #58a6ff); }
      }
      @keyframes borderGlow {
        0%, 100% { stroke: #21262d; stroke-width: 1; }
        50% { stroke: #58a6ff; stroke-width: 1.5; }
      }
      @keyframes scan {
        0% { transform: translateY(-10px); opacity: 0.03; }
        50% { opacity: 0.06; }
        100% { transform: translateY(200px); opacity: 0.03; }
      }
      @keyframes countUp {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      @keyframes typeWriter {
        from { clip-path: inset(0 100% 0 0); }
        to { clip-path: inset(0 0% 0 0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117" rx="12"/>

  <!-- Subtle scanline effect -->
  <rect class="scanline" x="0" y="0" width="800" height="3" fill="#58a6ff" opacity="0.04"/>

  <!-- Top border glow line -->
  <line class="border-glow" x1="40" y1="0" x2="760" y2="0"/>

  <!-- Corner brackets top-left -->
  <path d="M20 15 L20 5 L30 5" fill="none" stroke="#30363d" stroke-width="1.5"
        style="animation: fadeIn 0.5s ease forwards; opacity:0;"/>
  <!-- Corner brackets top-right -->
  <path d="M780 15 L780 5 L770 5" fill="none" stroke="#30363d" stroke-width="1.5"
        style="animation: fadeIn 0.5s ease forwards; opacity:0;"/>
  <!-- Corner brackets bottom-left -->
  <path d="M20 185 L20 195 L30 195" fill="none" stroke="#30363d" stroke-width="1.5"
        style="animation: fadeIn 0.5s ease 1.8s forwards; opacity:0;"/>
  <!-- Corner brackets bottom-right -->
  <path d="M780 185 L780 195 L770 195" fill="none" stroke="#30363d" stroke-width="1.5"
        style="animation: fadeIn 0.5s ease 1.8s forwards; opacity:0;"/>

  <!-- Comment line -->
  <text class="comment" x="40" y="38" font-family="'Courier New', monospace"
        font-size="12" fill="#6e7681">// yaswanthme007 · github profile</text>

  <!-- YASWANTH animated outline glow -->
  <text class="name-text" x="38" y="105"
        font-family="'Courier New', monospace" font-size="58" font-weight="900"
        letter-spacing="6" fill="transparent" stroke="#58a6ff" stroke-width="1.5">
    YASWANTH
  </text>

  <!-- Blinking cursor after name -->
  <rect class="cursor" x="706" y="62" width="3" height="50" fill="#58a6ff"
        style="animation: blink 1s steps(1) infinite 2s, fadeIn 0.1s ease 1s forwards; opacity:0;"/>

  <!-- Roles line with typewriter feel -->
  <text class="roles" x="40" y="132" font-family="'Courier New', monospace"
        font-size="13" fill="#e6edf3">
    <tspan fill="#a371f7">&gt;</tspan>
    <tspan> Full Stack Dev </tspan>
    <tspan fill="#30363d">·</tspan>
    <tspan fill="#a371f7"> &gt;</tspan>
    <tspan> AI Builder </tspan>
    <tspan fill="#30363d">·</tspan>
    <tspan fill="#a371f7"> &gt;</tspan>
    <tspan> Web3 Explorer </tspan>
    <tspan fill="#30363d">·</tspan>
    <tspan fill="#a371f7"> &gt;</tspan>
    <tspan> Chennai, India</tspan>
  </text>

  <!-- Stat box 1 -->
  <g class="box1">
    <rect x="40" y="148" width="155" height="38" rx="6"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text class="num1" x="117" y="163" font-family="'Courier New', monospace"
          font-size="14" font-weight="700" fill="#58a6ff" text-anchor="middle">389</text>
    <text x="117" y="178" font-family="'Courier New', monospace"
          font-size="11" fill="#e6edf3" text-anchor="middle">Contributions</text>
  </g>

  <!-- Stat box 2 -->
  <g class="box2">
    <rect x="208" y="148" width="155" height="38" rx="6"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text class="num2" x="285" y="163" font-family="'Courier New', monospace"
          font-size="14" font-weight="700" fill="#a371f7" text-anchor="middle">39</text>
    <text x="285" y="178" font-family="'Courier New', monospace"
          font-size="11" fill="#e6edf3" text-anchor="middle">Repositories</text>
  </g>

  <!-- Stat box 3 -->
  <g class="box3">
    <rect x="376" y="148" width="155" height="38" rx="6"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text class="num3" x="453" y="163" font-family="'Courier New', monospace"
          font-size="14" font-weight="700" fill="#3fb950" text-anchor="middle">11</text>
    <text x="453" y="178" font-family="'Courier New', monospace"
          font-size="11" fill="#e6edf3" text-anchor="middle">Followers</text>
  </g>

</svg>
