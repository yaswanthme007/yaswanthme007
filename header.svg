<svg width="800" height="200" viewBox="0 0 800 200"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .comment{animation:fadeUp 0.5s ease forwards;opacity:0}
      .name{animation:fadeUp 0.6s ease 0.3s forwards,glow 3s ease-in-out 1s infinite;opacity:0}
      .sub{animation:fadeUp 0.6s ease 0.7s forwards;opacity:0}
      .b1{animation:fadeUp 0.5s ease 1s forwards;opacity:0}
      .b2{animation:fadeUp 0.5s ease 1.15s forwards;opacity:0}
      .b3{animation:fadeUp 0.5s ease 1.3s forwards;opacity:0}
      .corners{animation:fadeUp 0.4s ease forwards;opacity:0}
      .cur{animation:blink 1s steps(1) infinite}
      .scan{animation:scan 7s linear infinite}
      @keyframes fadeUp{
        from{opacity:0;transform:translateY(10px)}
        to{opacity:1;transform:translateY(0)}
      }
      @keyframes glow{
        0%,100%{filter:drop-shadow(0 0 4px #58a6ff)}
        50%{filter:drop-shadow(0 0 14px #58a6ff) drop-shadow(0 0 28px #1a4a8a)}
      }
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{
        0%{transform:translateY(-4px);opacity:0}
        10%{opacity:0.06}
        90%{opacity:0.06}
        100%{transform:translateY(204px);opacity:0}
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#0d1117" rx="10"/>

  <!-- Scanline -->
  <rect class="scan" x="0" y="0" width="800" height="3" fill="#58a6ff"/>

  <!-- Corner brackets TL -->
  <path class="corners" d="M14 26 L14 10 L30 10"
        fill="none" stroke="#30363d" stroke-width="1.2"/>
  <!-- Corner brackets TR -->
  <path class="corners" d="M786 26 L786 10 L770 10"
        fill="none" stroke="#30363d" stroke-width="1.2"/>
  <!-- Corner brackets BL -->
  <path style="animation:fadeUp 0.4s ease 1.6s forwards;opacity:0"
        d="M14 174 L14 190 L30 190"
        fill="none" stroke="#30363d" stroke-width="1.2"/>
  <!-- Corner brackets BR -->
  <path style="animation:fadeUp 0.4s ease 1.6s forwards;opacity:0"
        d="M786 174 L786 190 L770 190"
        fill="none" stroke="#30363d" stroke-width="1.2"/>

  <!-- Top comment -->
  <text class="comment" x="34" y="30"
        font-family="'Courier New',monospace" font-size="11" fill="#3d444d">
    // yaswanthme007 · github profile · 2026
  </text>

  <!-- YASWANTH - large outline stroke text, clean and sharp -->
  <text class="name" x="34" y="108"
        font-family="'Courier New',monospace"
        font-size="72" font-weight="900"
        letter-spacing="8"
        fill="transparent"
        stroke="#58a6ff"
        stroke-width="1.8"
        paint-order="stroke">
    YASWANTH
  </text>

  <!-- Blinking cursor -->
  <rect class="cur"
        style="animation:blink 1s steps(1) infinite, fadeUp 0.1s ease 0.9s forwards;opacity:0"
        x="755" y="68" width="3" height="48" fill="#58a6ff"/>

  <!-- Roles line -->
  <text class="sub" x="34" y="135"
        font-family="'Courier New',monospace" font-size="13">
    <tspan fill="#a371f7">&gt;</tspan>
    <tspan fill="#e6edf3"> Full Stack Dev </tspan>
    <tspan fill="#3d444d">·</tspan>
    <tspan fill="#a371f7"> &gt;</tspan>
    <tspan fill="#e6edf3"> AI Builder </tspan>
    <tspan fill="#3d444d">·</tspan>
    <tspan fill="#a371f7"> &gt;</tspan>
    <tspan fill="#e6edf3"> Web3 Explorer </tspan>
    <tspan fill="#3d444d">·</tspan>
    <tspan fill="#a371f7"> &gt;</tspan>
    <tspan fill="#e6edf3"> Chennai, India</tspan>
  </text>

  <!-- Stat box 1 - Contributions -->
  <g class="b1">
    <rect x="34" y="148" width="160" height="38" rx="5"
          fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="114" y="163" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="15"
          font-weight="700" fill="#58a6ff">389</text>
    <text x="114" y="179" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="10.5"
          fill="#e6edf3">contributions</text>
  </g>

  <!-- Stat box 2 - Repos -->
  <g class="b2">
    <rect x="206" y="148" width="160" height="38" rx="5"
          fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="286" y="163" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="15"
          font-weight="700" fill="#a371f7">43</text>
    <text x="286" y="179" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="10.5"
          fill="#e6edf3">repositories</text>
  </g>

  <!-- Stat box 3 - Followers -->
  <g class="b3">
    <rect x="378" y="148" width="160" height="38" rx="5"
          fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="458" y="163" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="15"
          font-weight="700" fill="#3fb950">11</text>
    <text x="458" y="179" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="10.5"
          fill="#e6edf3">followers</text>
  </g>

  <!-- Right side subtle label -->
  <text style="animation:fadeUp 0.5s ease 1.5s forwards;opacity:0"
        x="766" y="179" text-anchor="end"
        font-family="'Courier New',monospace" font-size="10"
        fill="#3d444d">Chennai, IN · yaswanthkb.dev</text>

</svg>
